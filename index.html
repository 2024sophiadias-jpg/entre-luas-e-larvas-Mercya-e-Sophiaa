// ---- 3D ----
let sc,cam,rend,ctl,obj,raf3;
function moon(){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.SphereGeometry(1.2,48,48),new THREE.MeshStandardMaterial({color:0xe6dcae,roughness:1})));[[.5,.6],[-.7,.3],[.2,-.8],[-.3,-.4],[.9,-.2]].forEach(([a,b],i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.12+i*.03,16,16),new THREE.MeshStandardMaterial({color:0x8d855f,roughness:1}));m.position.set(Math.sin(a*3)*Math.cos(b*2),Math.sin(b*2),Math.cos(a*3)*Math.cos(b*2)).normalize().multiplyScalar(1.2);m.scale.set(1,1,.35);m.lookAt(0,0,0);g.add(m)});return g}
function add3(o){if(obj)sc.remove(obj);const b=new THREE.Box3().setFromObject(o),z=new THREE.Vector3();b.getSize(z);o.scale.multiplyScalar(2.4/(Math.max(z.x,z.y,z.z)||1));o.position.sub(new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()));obj=new THREE.Group();obj.add(o);sc.add(obj)}
function load3(){if(!S.m3)return add3(moon());fetch(S.m3).then(r=>r.text()).then(t=>{if(S.m3t=='obj')add3(new THREE.OBJLoader().parse(t));else new THREE.GLTFLoader().parse(t,'',g=>add3(g.scene),()=>{msg('Modelo 3D inválido');add3(moon())})}).catch(()=>{msg('Não foi possível abrir o modelo');add3(moon())})}
function init3(){cancelAnimationFrame(raf3);const el=document.getElementById('v3');if(!el||!window.THREE)return;try{sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(45,el.clientWidth/360,.1,100);cam.position.set(0,0,4);rend=new THREE.WebGLRenderer({antialias:true,alpha:true});rend.setSize(el.clientWidth,360);el.innerHTML='';el.appendChild(rend.domElement);sc.add(new THREE.AmbientLight(0x8890b0,.9));const d=new THREE.DirectionalLight(0xfff2c0,1.2);d.position.set(3,2,4);sc.add(d);ctl=THREE.OrbitControls?new THREE.OrbitControls(cam,rend.domElement):null;if(ctl)ctl.autoRotate=true;obj=null;load3();(function l(){raf3=requestAnimationFrame(l);ctl&&ctl.update();rend.render(sc,cam)})()}catch(err){el.textContent='3D indisponível neste aparelho'}}
async function save(){const a=await claude.use('artifact');if(!a)return msg('Sem permissão');const c=document.documentElement.cloneNode(true);['app','bar','player','intro'].forEach(k=>c.querySelector('#'+k).innerHTML='');c.querySelector('#intro').className='';c.querySelector('body').className='';c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');try{await a.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(err){msg('Não foi possível salvar')}}
function adminUI(){bar.innerHTML=`<label>Fundo <input type="color" id="cb" value="${S.c.bg||'#0b1020'}"></label><label>Destaque <input type="color" id="ca" value="${S.c.ac||'#e2b714'}"></label><button id="bi">🎬 Abertura</button><button id="bix">🗑 Abertura</button><button id="bm">🎵 Música</button><button id="b3">🧊 3D</button><button id="bgal">➕ Foto</button><button id="be">✏️ Editar</button><button id="bs">💾 Salvar</button>`;
cb.oninput=()=>{S.c.bg=cb.value;color()};ca.oninput=()=>{S.c.ac=ca.value;color()};
bi.onclick=async()=>{const f=await pickFile('video/*,.mp4,.webm');if(!f)return;const u=await up(f);if(u){S.intro=u;msg('Abertura trocada. Clique em Salvar.');showIntro()}};
bix.onclick=()=>{delete S.intro;msg('Abertura padrão restaurada. Clique em Salvar.')};
bm.onclick=async()=>{const f=await pickFile('audio/*,.mp3,.ogg,.wav,.m4a,.webm,.mp4');if(!f)return;const u=await up(f);if(u){stopAll();S.music=u;msg('Música trocada. Clique em Salvar.')}};
b3.onclick=async()=>{const f=await pickFile('.gltf,.obj');if(!f)return;const t=/\.obj$/i.test(f.name)?'obj':'gltf';const u=await up(new Blob([f],{type:t=='obj'?'text/plain':'application/json'}));if(u){S.m3=u;S.m3t=t;init3();msg('Modelo 3D adicionado. Clique em Salvar.')}};
bgal.onclick=()=>{S.ge=(S.ge||0)+1;render();msg('Espaço de foto adicionado')};
be.onclick=()=>{setEdit(!editing);be.textContent=editing?'👁 Visualizar':'✏️ Editar'};bs.onclick=save}
function showIntro(){const n=document.getElementById('intro');n.className='';const close=()=>n.classList.add('out');
const dflt=()=>{n.innerHTML='<div class="im">🌙</div><h1 class="i1">Entre Luas e Larvas</h1><p class="i2">Onde a verdade é uma mentira e a imaginação é a única saída.</p><button class="btn i3" id="isk">Entrar</button>';isk.onclick=close};
if(!S.intro)return dflt();
n.innerHTML=`<video id="iv" src="${esc(S.intro)}" autoplay muted playsinline></video><div style="margin-top:1rem;display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center"><button class="btn" id="isk">Pular abertura</button><button class="btn" id="isn">🔊 Ativar som</button></div>`;
isk.onclick=close;isn.onclick=()=>{iv.muted=!iv.muted;isn.textContent=iv.muted?'🔊 Ativar som':'🔇 Sem som'};iv.onended=close;iv.onerror=dflt}
color();render();showIntro();
claude.use('user').then(u=>{if(u&&u.canEdit())adminUI()}).catch(()=>{});
</script>



</body></html>
